name: Build arm64 binary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - run: go build -o opencode .

      - name: Verify binary
        run: |
          file opencode
          ./opencode version || ./opencode --version || true

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-arm64
          path: opencode
          retention-days: 30
